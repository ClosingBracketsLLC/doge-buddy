services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: doge
      POSTGRES_PASSWORD: doge
      POSTGRES_DB: doge_buddy
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doge -d doge_buddy"]
      interval: 2s
      timeout: 3s
      retries: 15
