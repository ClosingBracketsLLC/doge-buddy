name: Storefront 1000173017
on: [push]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          check-latest: true

      # Shopify's generated template assumes a single-repo npm project (npm ci at the root,
      # package-lock.json cache key, hydrogen deploy from the root). This repo is a pnpm
      # monorepo with the Hydrogen app in apps/storefront, so the install/deploy steps are
      # adapted; the checkout/setup-node pins above are kept as generated.
      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Publish to Oxygen
        working-directory: apps/storefront
        # --path "$PWD" for the same pnpm INIT_CWD quirk the storefront's own scripts work
        # around (see README): without it the Shopify CLI resolves the project root to the
        # repo root and Hydrogen's project detection breaks.
        run: pnpm exec shopify hydrogen deploy --path "$PWD"
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000173017 }}
